name: Build Stock Kernel - Poco M4 5G (WiFi/BT Fixed)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git make bc bison flex cpio zip unzip curl wget python3 libssl-dev libelf-dev libncurses-dev rsync lz4 xz-utils device-tree-compiler gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Download Android Clang
        run: |
         git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang
         echo "$GITHUB_WORKSPACE/clang/clang-r416183b/bin" >> $GITHUB_PATH

      - name: Set Defconfig
        run: |
          echo "DEFCONFIG=light_defconfig" >> $GITHUB_ENV

      - name: Add WiFi/Bluetooth Configuration
        run: |
          echo "========== Adding WiFi/BT =========="
          cat >> arch/arm64/configs/light_defconfig <<'WIFIBT'

# WiFi and Bluetooth - MediaTek MT6833
CONFIG_WLAN=y
CONFIG_MAC80211=y
CONFIG_RFKILL=y
CONFIG_RFKILL_GPIO=y
CONFIG_BT=y
CONFIG_BT_L2CAP=y
CONFIG_BT_SCO=y
CONFIG_BT_RFCOMM=y
CONFIG_BT_BNEP=y
CONFIG_BT_HIDP=y
CONFIG_BT_HS=y
CONFIG_BT_LE=y
CONFIG_BT_6LOWPAN=y
WIFIBT

      - name: Apply OSS Fixes
        run: |
          mkdir -p vendor/xiaomi/kernel_modules/mihw
          cat > vendor/xiaomi/kernel_modules/mihw/Makefile <<'EOF'
          obj-y :=
          EOF
          sed -i '/vendor\/xiaomi\/kernel_modules\/mihw/d' drivers/mihw/Makefile || true
          mkdir -p drivers/gpu/mediatek/gpufreq/mt6853
          cat > drivers/gpu/mediatek/gpufreq/mt6853/Makefile <<'EOF'
          obj-y :=
          EOF
          sed -i '/focaltech_test/d' drivers/input/touchscreen/mediatek/FT8722/Makefile || true
          sed -i '/nt36xxx_mp_ctrlram/d' drivers/input/touchscreen/mediatek/NT36672C/Makefile || true

      - name: Generate Config
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          make "$DEFCONFIG"
          scripts/config --enable WLAN --enable MAC80211 --enable RFKILL --enable RFKILL_GPIO --enable BT --enable BT_L2CAP --enable BT_SCO --enable BT_RFCOMM --enable BT_BNEP --enable BT_HIDP --enable BT_HS --enable BT_LE --enable BT_6LOWPAN
          scripts/config --set-str LOCALVERSION ""
          scripts/config --disable LOCALVERSION_AUTO
          yes "" | make olddefconfig

      - name: Build Kernel
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/clang-r416183b/bin:$PATH
          export ARCH=arm64 SUBARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- KBUILD_BUILD_USER=xiaomi KBUILD_BUILD_HOST=builder KBUILD_BUILD_VERSION=1
          make -j$(nproc) ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- Image.gz dtbs modules

      - name: Verify Build
        run: |
          test -f arch/arm64/boot/Image.gz
          file arch/arm64/boot/Image.gz
          echo "✅ WiFi/BT Config:"
          grep "^CONFIG_WLAN=" .config
          grep "^CONFIG_BT=" .config

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: compiled-kernel-wifi-bt
          path: |
            arch/arm64/boot/Image*
            arch/arm64/boot/dtb*
            .config
          retention-days: 7
