name: Xiaomi 11T Pro KernelSU Next Builder

on:
  push:
    branches: [ vili, vili-r-oss, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Setup KernelSU Next
        run: |
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s next

      - name: Install Dependencies & Tools
        run: |
          sudo apt-get update && sudo apt-get install -y \
            build-essential gcc-10 g++-10 gcc-10-aarch64-linux-gnu gcc-10-arm-linux-gnueabi \
            libncurses5-dev bison flex bc git libssl-dev wget zip cpio python3 python3-pip \
            device-tree-compiler libyaml-dev

      - name: Compile Kernel and Fix Host DTC
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          
          export KBUILD_BUILD_USER="frenkymahn"
          export KBUILD_BUILD_HOST="frenkymahn-PC"
          
          make O=out defconfig
          
          echo "CONFIG_KSU=y" >> out/.config
          echo "CONFIG_TMPFS_XATTR=y" >> out/.config
          echo "CONFIG_BPF=y" >> out/.config
          echo "CONFIG_BPF_SYSCALL=y" >> out/.config
          echo "CONFIG_BPF_JIT=y" >> out/.config
          echo "CONFIG_NET_CLS_BPF=y" >> out/.config
          echo "CONFIG_NET_ACT_BPF=y" >> out/.config
          echo "CONFIG_BPF_EVENTS=y" >> out/.config
          
          make O=out olddefconfig

          # Pre-create scripts/dtc directory in out if not exists and bypass host dtc link error
          mkdir -p out/scripts/dtc
          
          # Compile kernel using system gcc-10 with relaxed warnings
          make -j$(nproc) O=out \
            HOSTCC=gcc-10 \
            HOSTCXX=g++-10 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LOCALVERSION="-Dark_kernel" \
            KCFLAGS="-Wno-error=array-bounds -Wno-error=stringop-overflow -Wno-error=unused-but-set-variable -fcommon" \
            Image.gz dtbo.img || { echo "=== BUILD FAILED ==="; exit 1; }
            
      - name: Package Images
        run: |
          mkdir -p final_images
          cp out/arch/arm64/boot/Image final_images/boot.img
          [ -f out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img final_images/
          
          git clone https://github.com/osm0sis/AnyKernel3.git ak3
          cp out/arch/arm64/boot/Image ak3/
          cd ak3 && zip -r ../Xiaomi-11T-Pro-DarkKernel-KSU-Next.zip * && cd ..

      - name: Upload All Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi-11T-Pro-DarkKernel-Images
          path: |
            final_images/*
            Xiaomi-11T-Pro-DarkKernel-KSU-Next.zip
