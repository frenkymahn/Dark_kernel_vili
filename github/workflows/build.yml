name: Build Xiaomi Muyu Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: muyu-v-oss
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libelf-dev bison flex libssl-dev git rsync unzip zip tar lz4 liblz4-tool ccache gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Download Neutron Clang (Optimized)
        run: |
          mkdir -p clang
          cd clang
          curl -Lo antman https://raw.githubusercontent.com/Neutron-Toolchains/clang-releases/main/antman
          chmod +x antman
          ./antman -S

      - name: Build Kernel
        run: |
          export PATH=$(pwd)/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          
          # پیدا کردن فایل کانفیگ اختصاصی دستگاه
          if [ -f arch/arm64/configs/vendor/muyu_defconfig ]; then
            CONFIG="vendor/muyu_defconfig"
          elif [ -f arch/arm64/configs/muyu_defconfig ]; then
            CONFIG="muyu_defconfig"
          elif [ -f arch/arm64/configs/vendor/sm8635_defconfig ]; then
            CONFIG="vendor/sm8635_defconfig"
          else
            CONFIG="gki_defconfig"
          fi
          
          echo "Using Config: $CONFIG"
          
          # ساخت تنظیمات اولیه
          make O=out ARCH=arm64 CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 LLVM_IAS=1 $CONFIG
            
          # شروع عملیات کامپایل اصلی
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LLVM=1 LLVM_IAS=1

      - name: Package Kernel (AnyKernel3)
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          
          # پیدا کردن ایمیج ساخته شده و کپی کردن آن به AnyKernel
          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image AnyKernel3/
          elif [ -f out/arch/arm64/boot/Image.lz4 ]; then
            cp out/arch/arm64/boot/Image.lz4 AnyKernel3/
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz AnyKernel3/
          else
            echo "Error: Kernel Image not found!"
            exit 1
          fi
          
          cd AnyKernel3
          # غیرفعال کردن چک کردن مدل برای راحتی فلش
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          zip -r9 ../muyu-custom-kernel.zip * -x .git* README.md

      - name: Upload Custom Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Muyu-Custom-Kernel
          path: muyu-custom-kernel.zip
